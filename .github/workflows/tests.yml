name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (export)
        run: python -m unittest discover -s tests -v
      - name: Unit tests (collector)
        run: python -m unittest discover -s collector/tests -v
      - name: Smoke test (demo data)
        run: python demo/make_sample.py --out /tmp/demo_out
      - name: JavaScript syntax check
        run: for f in app.js dns.js theme-init.js; do node --check "$f"; done
